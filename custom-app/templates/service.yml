apiVersion: v1
kind: Service
metadata:
  name: pyecho-svc
spec:
  selector:
    app: {{ .Values.labels.app }}
    stack: {{ .Values.labels.stack }}
  type: NodePort
  ports:
  - name: {{ .Values.labels.stack }}
    nodePort: {{ .Values.service.nodePort }}
    targetPort: {{ .Values.containerPort }}
    port: {{ .Values.service.http }}
    protocol: "TCP"